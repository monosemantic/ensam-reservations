<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENSAM Réservations</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
  <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3">
  <a class="navbar-brand" th:href="@{/}">ENSAM Réservations</a>
  <ul class="navbar-nav flex-row gap-3">
    <li class="nav-item"><a class="nav-link" th:href="@{/admin/departements}">Départements</a></li>
    <li class="nav-item"><a class="nav-link" th:href="@{/admin/salles}">Salles</a></li>
  </ul>
</nav>

<div class="container my-4">
  <div class="card">
    <div class="card-body">
      <div class="alert alert-success" th:if="${succes}" th:text="${succes}"></div>
      <div class="alert alert-danger" th:if="${erreur}" th:text="${erreur}"></div>
      <section layout:fragment="content"></section>
    </div>
  </div>
</div>
</body>
</html>
