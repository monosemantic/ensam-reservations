<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{template}">
<body>
<div layout:fragment="content">
  <h3 th:text="${departement.id == null} ? 'Nouveau département' : 'Modifier le département'"></h3>
  <form th:action="@{/admin/departements/save}" th:object="${departement}" method="post" class="w-50">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3">
      <label class="form-label" for="nom">Nom</label>
      <input id="nom" type="text" class="form-control" th:field="*{nom}">
      <div class="text-danger" th:errors="*{nom}"></div>
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a class="btn btn-secondary" th:href="@{/admin/departements}">Annuler</a>
  </form>
</div>
</body>
</html>
